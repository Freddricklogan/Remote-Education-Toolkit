<title>Remote Education Toolkit — timer, attendance, randomizer</title>
<meta name="description" content="Three browser-based classroom tools with tested logic: an agenda timer that cannot drift, an attendance tracker with rates, alerts and CSV round-trip, and a fair cold-call and grouping randomizer. No server; data stays in your browser. By Freddrick Logan.">

<body>
<main id="demo-root" class="exec-main">
  <div class="tabs" role="tablist" aria-label="Tools">
    <button type="button" role="tab" data-tab="timer" aria-selected="true" aria-controls="panel-timer" id="tab-timer">Class Timer</button>
    <button type="button" role="tab" data-tab="attendance" aria-selected="false" aria-controls="panel-attendance" id="tab-attendance">Attendance Tracker</button>
    <button type="button" role="tab" data-tab="randomizer" aria-selected="false" aria-controls="panel-randomizer" id="tab-randomizer">Discussion Randomizer</button>
  </div>
  <section class="panel" id="panel-timer" role="tabpanel" aria-labelledby="tab-timer"></section>
  <section class="panel" id="panel-attendance" role="tabpanel" aria-labelledby="tab-attendance" hidden></section>
  <section class="panel" id="panel-randomizer" role="tabpanel" aria-labelledby="tab-randomizer" hidden></section>
  <p class="method">Each tool also has its own page: <a href="tools/class-timer.html">Class Timer</a> · <a href="tools/attendance-tracker.html">Attendance Tracker</a> · <a href="tools/discussion-randomizer.html">Discussion Randomizer</a>. Guidance: <a href="https://github.com/Freddricklogan/Remote-Education-Toolkit/blob/main/docs/remote-teaching-best-practices.md">Remote teaching best practices</a>.</p>
</main>
